<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <title>Escaner AR — Copa Mundial 2026</title>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}

      /* Video de camara de fondo */
      #cameraVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
      
      /* Ocultar el canvas de MindAR por defecto */
      .mindar-ui-overlay{display:none!important}
      .mindar-ui-loading{display:none!important}

      /* Overlay de bienvenida */
      #overlay{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);padding:24px;text-align:center;gap:14px}
      #overlay h1{color:#fff;font-size:24px;font-weight:900}
      #overlay p{color:#c4b5fd;font-size:14px;max-width:320px;line-height:1.6}
      .trophy{font-size:64px;animation:float 3s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

      #startBtn{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;border:none;border-radius:999px;padding:14px 28px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(124,58,237,.5);transition:transform .15s}
      #startBtn:hover{transform:scale(1.05)}

      #errorBox{display:none;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#fca5a5;border-radius:12px;padding:12px 16px;font-size:13px;max-width:340px;line-height:1.5}

      /* Escena 3D sobre la camara */
      #sceneWrap{position:fixed;inset:0;z-index:5;pointer-events:none}
      #sparkLayer{position:fixed;inset:0;z-index:15;pointer-events:none;display:none;overflow:hidden}
      #sparkLayer.active{display:block}
      .spark{
        position:absolute;
        width:18px;
        height:18px;
        background:linear-gradient(180deg,#fff7c2 0%,#ffd54f 55%,#ffb300 100%);
        clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
        box-shadow:0 0 10px rgba(255,245,157,.95),0 0 22px rgba(255,193,7,.7);
        opacity:0;
        mix-blend-mode:screen;
        animation:sparkBurst var(--spark-duration,2.2s) ease-in-out forwards;
      }
      @keyframes sparkBurst{
        0%{opacity:0;transform:translate3d(0,18px,0) scale(.45) rotate(0deg)}
        15%{opacity:1}
        55%{opacity:.95}
        100%{opacity:0;transform:translate3d(var(--spark-x,0px),var(--spark-y,-120px),0) scale(1.15) rotate(var(--spark-rotate,180deg))}
      }
      a-scene{background:transparent!important}
      a-scene canvas,.a-canvas{background:transparent!important}

      /* Camera effect: ciclo de color tipo "luces/fuegos artificiales" */
      #cameraVideo.effect-on{
        animation: videoColorCycle 4s linear infinite;
        filter:hue-rotate(0deg) saturate(1.3) contrast(1.05) brightness(1.05);
      }

      /* También aplicar el efecto a toda la escena AR cuando esté activo */
      body.ar-effect-on #sceneWrap{
        animation: videoColorCycle 4s linear infinite;
        filter:hue-rotate(0deg) saturate(1.3) contrast(1.05) brightness(1.05);
      }

      @keyframes videoColorCycle{
        0%{filter:hue-rotate(0deg) saturate(1.3) contrast(1.05) brightness(1.05);}
        25%{filter:hue-rotate(90deg) saturate(1.6) contrast(1.1) brightness(1.08);}
        50%{filter:hue-rotate(180deg) saturate(1.8) contrast(1.15) brightness(1.1);}
        75%{filter:hue-rotate(270deg) saturate(1.6) contrast(1.1) brightness(1.08);}
        100%{filter:hue-rotate(360deg) saturate(1.3) contrast(1.05) brightness(1.05);}
      }

      /* Debug info */
      #debugInfo{display:none}

      /* Controles AR */
      #backBtn{position:fixed;top:14px;left:14px;z-index:130;display:none;align-items:center;gap:6px;background:rgba(0,0,0,.65);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;backdrop-filter:blur(6px)}

      #statusBar{position:fixed;bottom:20px;left:16px;right:16px;z-index:130;display:none;align-items:center;justify-content:center;gap:8px;background:rgba(0,0,0,.65);color:#e9d5ff;border:1px solid rgba(124,58,237,.4);border-radius:999px;padding:10px 18px;font-size:14px;font-weight:500;backdrop-filter:blur(6px)}
      .pulse-dot{width:8px;height:8px;background:#4ade80;border-radius:50%;animation:pulse 1.5s ease-in-out infinite;flex-shrink:0}
      @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

      #actionBar{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:130;display:none;align-items:center;gap:10px}
      .action-btn{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;border:1px solid rgba(124,58,237,.6);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px)}

      #infoPanel{position:fixed;bottom:120px;left:16px;right:16px;z-index:130;display:none;background:rgba(15,23,42,.85);color:#e2e8f0;border:1px solid rgba(124,58,237,.35);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;backdrop-filter:blur(8px)}

      /* Marco de escaneo */
      #scanFrame{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;pointer-events:none}
      .frame-box{width:min(70vw,70vh);height:min(70vw,70vh);position:relative}
      .corner{position:absolute;width:28px;height:28px;border-color:#a78bfa;border-style:solid;border-width:0}
      .corner.tl{top:0;left:0;border-top-width:3px;border-left-width:3px;border-radius:4px 0 0 0}
      .corner.tr{top:0;right:0;border-top-width:3px;border-right-width:3px;border-radius:0 4px 0 0}
      .corner.bl{bottom:0;left:0;border-bottom-width:3px;border-left-width:3px;border-radius:0 0 0 4px}
      .corner.br{bottom:0;right:0;border-bottom-width:3px;border-right-width:3px;border-radius:0 0 4px 0}
      .scan-line{position:absolute;left:4px;right:4px;height:2px;background:linear-gradient(90deg,transparent,#a78bfa,transparent);animation:scanAnim 2s ease-in-out infinite}
      @keyframes scanAnim{0%{top:4px;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:calc(100% - 6px);opacity:0}}
      /* Video modal */
      #videoModal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.7)}
      .video-modal-content{width:min(920px,94vw);background:#0b1020;border-radius:12px;padding:12px;box-shadow:0 8px 40px rgba(0,0,0,0.6);display:flex;flex-direction:column;gap:8px}
      .video-area{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;border-radius:8px}
      .video-area video, .video-area iframe{width:100%;height:100%;object-fit:cover;border:0}
      .filters-row{display:flex;gap:8px;align-items:center}
      .filters-row label{color:#e6e8eb;font-size:13px}
      .close-video-btn{margin-left:auto;padding:8px 12px;border-radius:8px;background:#a78bfa;color:#111;border:none;cursor:pointer}

      @media (max-width: 768px) {
        #cameraVideo,
        #sceneWrap{
          transform:scale(1.08,1.22);
          transform-origin:center center;
        }

        #statusBar{
          bottom:calc(env(safe-area-inset-bottom, 0px) + 6px);
          left:12px;
          right:12px;
          padding:7px 12px;
          font-size:12px;
        }

        #actionBar{
          bottom:calc(env(safe-area-inset-bottom, 0px) + 42px);
          gap:8px;
        }

        .action-btn{
          padding:7px 12px;
          font-size:12px;
        }

        #infoPanel{
          bottom:calc(env(safe-area-inset-bottom, 0px) + 80px);
          left:12px;
          right:12px;
          padding:8px 10px;
          font-size:12px;
          line-height:1.35;
          max-height:72px;
          overflow:auto;
        }
      }
    </style>

    <div id="sparkLayer"></div>

    <!-- Overlay de inicio -->

      <h1>Copa AR — Mundial 2026</h1>
      <p>Activa la camara y veras la Copa del Mundo en 3D flotando en realidad aumentada.</p>
      <div id="errorBox"></div>
      <button id="startBtn">Activar camara AR</button>
    </div>

    <button id="backBtn">&#8592; Volver</button>

    <div id="scanFrame">

        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
        <div class="scan-line"></div>
      </div>
    </div>

    <div id="statusBar">
      <div class="pulse-dot"></div>
      <span id="statusText">Copa 3D en pantalla</span>
    </div>

    <div id="actionBar">
      <button id="animateBtn" class="action-btn">Animar</button>
      <button id="effectBtn" class="action-btn">Efecto</button>
      <button id="infoBtn" class="action-btn">Info</button>
    </div>

    <div id="infoPanel">
      Mueve la camara lentamente y manten el escudo bien iluminado. La copa aparece cuando el sistema reconoce la imagen.

    <script>
      const overlay   = document.getElementById('overlay');
      const startBtn  = document.getElementById('startBtn');
      const backBtn   = document.getElementById('backBtn');
      const statusBar = document.getElementById('statusBar');
      const actionBar = document.getElementById('actionBar');
      const animateBtn = document.getElementById('animateBtn');
      const infoBtn = document.getElementById('infoBtn');
      const infoPanel = document.getElementById('infoPanel');
      const scanFrame = document.getElementById('scanFrame');
      const errorBox  = document.getElementById('errorBox');
      const video     = document.getElementById('cameraVideo');
      const sparkLayer = document.getElementById('sparkLayer');
      const copaEl    = document.getElementById('copaEntity');
      const copaAlemaniaEl = document.getElementById('copaAlemaniaEntity');
      const scene     = document.getElementById('arScene');

      const rotationAnim = 'property: rotation; from: 0 0 0; to: 0 360 0; loop: true; dur: 6000; easing: linear';

      const debugEl = document.getElementById('debugInfo');
      const debugLog = (msg) => {
        console.log('[AR]', msg);
        debugEl.style.display = 'block';
        debugEl.innerHTML += msg + '<br>';
      };

      const showError = (msg) => {
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
      };

      // --- Video button UI (appears when a target is detected) ---
      const videoBtnContainer = document.createElement('div');
      videoBtnContainer.id = 'videoBtnContainer';
      videoBtnContainer.style.position = 'fixed';
      videoBtnContainer.style.bottom = '140px';
      videoBtnContainer.style.left = '50%';
      videoBtnContainer.style.transform = 'translateX(-50%)';
      videoBtnContainer.style.zIndex = '30';
      videoBtnContainer.style.display = 'none';
      document.body.appendChild(videoBtnContainer);

      const videoBtn = document.createElement('button');
      videoBtn.id = 'videoBtn';
      videoBtn.textContent = 'Ver video';
      videoBtn.className = 'action-btn';
      videoBtn.style.padding = '12px 24px';
      videoBtnContainer.appendChild(videoBtn);

      // Mapeo de videos por clave de target (extiende según necesites)
      const videosPorSeleccion = {
        alemania: '/Videos/Videos-Alemania/Videos-Alemania-1.mp4',
        arabia: '/Videos/Arabia Saudita.mp4',
        argelia: '/Videos/Argelia.mp4',
        argentina: '/Videos/Videos-Argentina/Video-Argentina-1.mp4',
        austria: '/Videos/Austria.mp4',
        belgica: '/Videos/VideoBelgica.mp4',
        brasil: '/Videos/Videos-Brasil/Video-Brasil-1.mp4',
        camerun: '/Videos/Camerun.mp4',
        canada: '/Videos/Videos-Canada/Video-Canada-1.mp4',
        chile: '/Videos/VideoChile.mp4',
        colombia: '/Videos/VideoColombia.mp4',
        corea: '/Videos/Corea.mp4',
        costamarfil: '/Videos/Costa de Marfil.mp4',
        croacia: '/Videos/Croacia.mp4',
        dinamarca: '/Videos/VideoDinamarca.mp4',
        ecuador: '/Videos/VideoEcuador.mp4',
        egipto: '/Videos/Egipto.mp4',
        emiratos: '/Videos/Emiratos.mp4',
        españa: '/Videos/Videos-España/Video-España-1.mp4',
        francia: '/Videos/Videos-Francia/Video-Francia-1.mp4',
        ghana: '/Videos/Ghana.mp4',
        inglaterra: '/Videos/VideoInglaterra.mp4',
        irak: '/Videos/Irak.mp4',
        iran: '/Videos/Iran.mp4',
        italia: '/Videos/VideoItalia.mp4',
        jamaica: '/Videos/VideoJamaica.mp4',
        japon: '/Videos/Japon.mp4',
        marruecos: '/Videos/Marruecos.mp4',
        mexico: '/Videos/Video Mexico.mp4',
        nigeria: '/Videos/Nigeria.mp4',
        nuevaZelanda: '/Videos/Nueva Zelanda.mp4',
        paisesBajos: '/Videos/VideoPaisesBajos.mp4',
        panama: '/Videos/videoPanama.mp4',
        peru: '/Videos/Peru.mp4',
        polonia: '/Videos/Polonia.mp4',
        portugal: '/Videos/VideoPortugal.mp4',
        senegal: '/Videos/Senegal.mp4',
        serbia: '/Videos/Serbia.mp4',
        suecia: '/Videos/Suecia.mp4',
        suiza: '/Videos/VideoSuiza.mp4',
        uruguay: '/Videos/VideosUruguay.mp4',
        usa: '/Videos/Videos-USA/Video-USA-1.mp4'
      };

      // Modal y reproductor embebido (soporta mp4 local o YouTube iframe)
      const videoModal = document.createElement('div');
      videoModal.id = 'videoModal';
      videoModal.style.display = 'none';
      videoModal.innerHTML = `
        <div class="video-modal-content">
          <div style="display:flex;align-items:center;gap:8px">
            <strong style="color:#fff">Reproductor</strong>
            <button id="closeVideoModal" class="close-video-btn">Cerrar</button>
          </div>
          <div class="video-area" id="videoArea"></div>
          <div class="filters-row">
            <label>Grayscale <input type="checkbox" id="fGray"></label>
            <label>Sepia <input type="checkbox" id="fSepia"></label>
            <label>Invert <input type="checkbox" id="fInvert"></label>
            <label>Brillo <input type="range" id="fBrightness" min="50" max="150" value="100"></label>
          </div>
        </div>
      `;
      document.body.appendChild(videoModal);

      const videoArea = videoModal.querySelector('#videoArea');
      const closeVideoModal = videoModal.querySelector('#closeVideoModal');
      const fGray = videoModal.querySelector('#fGray');
      const fSepia = videoModal.querySelector('#fSepia');
      const fInvert = videoModal.querySelector('#fInvert');
      const fBrightness = videoModal.querySelector('#fBrightness');

      function aplicarFiltros() {
        const parts = [];
        if (fGray.checked) parts.push('grayscale(100%)');
        if (fSepia.checked) parts.push('sepia(60%)');
        if (fInvert.checked) parts.push('invert(100%)');
        parts.push(`brightness(${fBrightness.value}%)`);
        videoArea.style.filter = parts.join(' ');
      }

      // Efecto para la cámara (botón Efecto)
      let sparkInterval = null;
      let sparkCleanupTimeout = null;

      function createSpark() {
        if (!sparkLayer) return;
        const spark = document.createElement('span');
        spark.className = 'spark';

        spark.style.left = `${6 + Math.random() * 88}%`;
        spark.style.top = `${12 + Math.random() * 76}%`;
        spark.style.width = `${12 + Math.random() * 14}px`;
        spark.style.height = spark.style.width;
        spark.style.setProperty('--spark-x', `${(Math.random() - 0.5) * 36}px`);
        spark.style.setProperty('--spark-y', `${-18 - Math.random() * 52}px`);
        spark.style.setProperty('--spark-rotate', `${90 + Math.random() * 240}deg`);
        spark.style.setProperty('--spark-duration', `${1.6 + Math.random() * 1.2}s`);

        sparkLayer.appendChild(spark);
        window.setTimeout(() => spark.remove(), 3200);
      }

      function setCameraEffect(on) {
        if (!sparkLayer) return;

        if (sparkCleanupTimeout) {
          clearTimeout(sparkCleanupTimeout);
          sparkCleanupTimeout = null;
        }

        if (on) {
          sparkLayer.classList.add('active');
          if (!sparkInterval) {
            for (let i = 0; i < 18; i += 1) createSpark();
            sparkInterval = window.setInterval(() => {
              const burstCount = 4 + Math.floor(Math.random() * 4);
              for (let i = 0; i < burstCount; i += 1) createSpark();
            }, 260);
          }
        } else {
          if (sparkInterval) {
            clearInterval(sparkInterval);
            sparkInterval = null;
          }
          sparkCleanupTimeout = window.setTimeout(() => {
            sparkLayer.classList.remove('active');
            sparkLayer.innerHTML = '';
          }, 700);
        }
      }

      fGray.addEventListener('change', aplicarFiltros);
      fSepia.addEventListener('change', aplicarFiltros);
      fInvert.addEventListener('change', aplicarFiltros);
      fBrightness.addEventListener('input', aplicarFiltros);

      const effectBtn = document.getElementById('effectBtn');
      let effectOn = false;
      if (effectBtn) {
        effectBtn.addEventListener('click', () => {
          // Solo permitir ACTIVAR el efecto si hay escudo detectado,
          // pero permitir DESACTIVARLO aunque ya no haya tracking
          if (!effectOn && !isTracking) return;

          effectOn = !effectOn;
          setCameraEffect(effectOn);
          effectBtn.textContent = effectOn ? 'Quitar efecto' : 'Efecto';
        });
      }

      function abrirModalVideo(url) {
        const safeUrl = /^https?:\/\//i.test(url) ? url : encodeURI(url);
        // Limpiar area
        videoArea.innerHTML = '';
        // Elegir entre mp4 local o youtube
        if (safeUrl.endsWith('.mp4') || safeUrl.endsWith('.webm') || safeUrl.endsWith('.ogg')) {
          const v = document.createElement('video');
          v.src = safeUrl;
          v.controls = true;
          v.autoplay = true;
          v.playsInline = true;
          videoArea.appendChild(v);
        } else {
          // asumir YouTube u otras iframes
          const iframe = document.createElement('iframe');
          iframe.src = safeUrl.replace('watch?v=', 'embed/');
          iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
          iframe.allowFullscreen = true;
          videoArea.appendChild(iframe);
        }
        aplicarFiltros();
        videoModal.style.display = 'flex';
      }

      function cerrarModalVideo() {
        // detener cualquier video
        const vid = videoArea.querySelector('video');
        if (vid) { vid.pause(); vid.src = ''; }
        videoArea.innerHTML = '';
        videoModal.style.display = 'none';
      }

      closeVideoModal.addEventListener('click', cerrarModalVideo);

      // Función para mostrar el botón y configurar la acción según la selección
      function mostrarBotonVideo(clave) {
        const url = videosPorSeleccion[clave];
        if (!url) return;
        videoBtnContainer.style.display = 'block';
        // Si estamos embebidos en un iframe, pedir al padre que abra el modal full-screen
        if (window.parent && window.parent !== window) {
          videoBtn.onclick = () => {
            window.parent.postMessage({ type: 'AR_OPEN_VIDEO', url }, '*');
          };
        } else {
          videoBtn.onclick = () => abrirModalVideo(url);
        }
      }

      function ocultarBotonVideo() {
        videoBtnContainer.style.display = 'none';
        videoBtn.onclick = null;
      }

      /* Boton volver */
      backBtn.addEventListener('click', () => {
        /* MindAR maneja la cámara automáticamente al detener la escena */
        debugLog('Deteniendo AR y volviendo...');
        
        if (window.parent !== window) {
          window.parent.postMessage({ type: 'AR_BACK' }, '*');
        } else {
          window.history.back();
        }
      });

      // Estado de animación y modelo actualmente activo (del país detectado)
      let animando = false;
      let currentModel = null;

      animateBtn.addEventListener('click', () => {
        if (!currentModel) return; // aún no hay ningún escudo detectado

        if (animando) {
          // Detener animación del modelo actual
          currentModel.removeAttribute('animation');
          currentModel.removeAttribute('animation__spin');
          animateBtn.textContent = 'Reanudar animación';
        } else {
          // Aplicar animación solicitada al modelo actual
          currentModel.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear');
          animateBtn.textContent = 'Detener animación';
        }
        animando = !animando;
      });

      // Actualiza el modelo actual a partir de un target MindAR (sirve para todos los países)
      function setCurrentModelFromTarget(targetEl) {
        if (!targetEl) return;
        const model = targetEl.querySelector('[gltf-model]');
        if (!model) return;

        // Si había otro modelo animándose, quitarle la animación
        if (currentModel && currentModel !== model) {
          currentModel.removeAttribute('animation');
          currentModel.removeAttribute('animation__spin');
        }

        currentModel = model;

        // Si el botón ya estaba en modo "animando", aplicar animación al nuevo modelo
        if (animando) {
          currentModel.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear');
        }
      }
